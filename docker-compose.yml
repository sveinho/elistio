version: '3.8'

services:
  # Vår egendefinerte Tika med Magika. Den trenger IKKE være åpen mot internett.
  tika:
    build: .
    container_name: tika-server
    restart: always

  # Open WebUI som kobler seg til Tika internt i nettverket.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    # Elestio bruker port 3000 som standard inngang til webtjenester
    ports:
      - "172.17.0.1:3000:8080" 
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - WEBUI_SECRET_KEY=endre_meg_til_noe_hemmelig
    depends_on:
      - tika
    restart: always

volumes:
  open-webui-data:
